<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로또 번호 추천기 - 초보자용</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background:#f6f7f9; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 18px; }
    .card { background: white; border: 1px solid #e6e8ee; border-radius: 14px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.04); }
    h1 { margin: 10px 0 6px; }
    p { margin: 0 0 12px; color: #555; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { font-weight: 700; display: block; margin: 10px 0 6px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccd2de; border-radius: 10px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccd2de; background: white; cursor: pointer; font-weight: 800; }
    button.primary { background:#111; color:white; border-color:#111; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .hint { font-size: 12px; color:#777; margin-top: 6px; }
    .result { font-size: 26px; font-weight: 900; letter-spacing: .5px; margin-top: 8px; }
    .badge { display:inline-block; padding: 4px 8px; border-radius: 999px; background:#eef1f7; font-size: 12px; margin-left: 6px; }
    .error { background:#fff3f3; border:1px solid #f1b9b9; padding:10px; border-radius: 10px; margin-top: 12px; }
    .history { border:1px solid #eef1f7; border-radius: 12px; overflow:hidden; max-height: 320px; overflow:auto; }
    .item { display:flex; justify-content: space-between; align-items:center; padding:10px 12px; border-top:1px solid #eef1f7; }
    .item:first-child { border-top: none; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    footer { margin-top: 14px; font-size: 12px; color:#777; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🎲 로또 번호 추천기 <span class="badge">초보자용</span></h1>
    <p>설치 없이 “웹서비스 느낌”만 빠르게 체험하는 버전입니다. (당첨은… 웹이 아니라 우주가 담당)</p>

    <div class="grid">
      <!-- 왼쪽: 입력 -->
      <div class="card">
        <h3 style="margin:0 0 8px;">조건 입력</h3>

        <label for="fixed">고정수(반드시 포함)</label>
        <input id="fixed" type="text" placeholder="예: 7, 13, 21" />
        <div class="hint">인식된 고정수: <span id="fixedView">없음</span></div>

        <label for="excluded">제외수(절대 미포함)</label>
        <input id="excluded" type="text" placeholder="예: 1 2 3" />
        <div class="hint">인식된 제외수: <span id="excludedView">없음</span></div>

        <label style="margin-top: 14px;">옵션</label>
        <div class="row">
          <label style="font-weight:600; display:flex; gap:8px; align-items:center; margin:0;">
            <input id="optConsec" type="checkbox" checked />
            연속 3개 이상 금지
          </label>

          <label style="font-weight:600; display:flex; gap:8px; align-items:center; margin:0;">
            <input id="optLastDigit" type="checkbox" />
            끝수 동일 3개 이상 금지
          </label>
        </div>

        <div class="row" style="margin-top: 14px;">
          <button class="primary" id="btnOne">1세트 추천</button>

          <div class="row">
            <input id="count" type="number" min="1" max="20" value="5" style="width:90px;" />
            <button id="btnMany">여러 세트(최대 20)</button>
          </div>
        </div>

        <div id="errorBox" class="error" style="display:none;"></div>
      </div>

      <!-- 오른쪽: 결과 -->
      <div class="card">
        <h3 style="margin:0 0 8px;">결과</h3>

        <div style="padding:12px; border:1px solid #eef1f7; border-radius:12px; background:#fafbfe;">
          <div style="font-size:13px; color:#666;">최근 1세트</div>
          <div id="current" class="result">아직 없음</div>
          <div class="row" style="margin-top:10px;">
            <button id="btnCopyOne" disabled>복사</button>
            <button id="btnCopyMany" disabled>여러 세트 복사</button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
          <h4 style="margin:0;">히스토리(최대 50)</h4>
          <div class="row">
            <button id="btnCopyAll" disabled>전체 복사</button>
            <button id="btnClear" disabled>초기화</button>
          </div>
        </div>

        <div id="history" class="history" style="margin-top:10px;">
          <div class="item" style="opacity:.7;">아직 기록이 없어요.</div>
        </div>

        <div id="manyBox" style="margin-top:12px; display:none;">
          <h4 style="margin:8px 0;">이번에 뽑은 여러 세트</h4>
          <pre id="manyText" style="white-space:pre-wrap; padding:12px; border:1px solid #eef1f7; border-radius:12px; background:#fafbfe;"></pre>
        </div>
      </div>
    </div>

    <footer>※ 이 페이지는 “로컬에서만” 동작하는 초간단 웹앱입니다. (서버/DB 없음)</footer>
  </div>

<script>
  // ---------- 유틸 ----------
  function parseNumberList(input) {
    const matches = (input.match(/\\d+/g) || []).map(Number);
    const set = new Set();
    for (const n of matches) if (n >= 1 && n <= 45) set.add(n);
    return Array.from(set);
  }

  function formatSet(nums) {
    return nums.map(n => String(n).padStart(2, "0")).join(", ");
  }

  function has3Consecutive(sortedNums) {
    let streak = 1;
    for (let i = 1; i < sortedNums.length; i++) {
      if (sortedNums[i] === sortedNums[i - 1] + 1) streak++;
      else streak = 1;
      if (streak >= 3) return true;
    }
    return false;
  }

  function has3SameLastDigit(nums) {
    const cnt = {};
    for (const n of nums) {
      const d = n % 10;
      cnt[d] = (cnt[d] || 0) + 1;
      if (cnt[d] >= 3) return true;
    }
    return false;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateOneSet(fixed, excluded, rules, maxTries = 5000) {
    const fixedSet = new Set(fixed);
    const excludedSet = new Set(excluded);

    for (const n of fixedSet) {
      if (excludedSet.has(n)) {
        throw new Error("고정수 " + n + " 이(가) 제외수에 포함되어 있어요. 제외수에서 빼주세요.");
      }
    }
    if (fixedSet.size > 6) throw new Error("고정수는 최대 6개까지 가능합니다.");

    const pool = [];
    for (let n = 1; n <= 45; n++) {
      if (!excludedSet.has(n) && !fixedSet.has(n)) pool.push(n);
    }

    const need = 6 - fixedSet.size;
    if (pool.length < need) throw new Error("제외수/고정수 조건 때문에 뽑을 수 있는 숫자가 부족해요.");

    const fixedArr = Array.from(fixedSet);

    for (let attempt = 0; attempt < maxTries; attempt++) {
      const chosen = new Set();
      while (chosen.size < need) chosen.add(pickRandom(pool));

      const result = fixedArr.concat(Array.from(chosen)).sort((a, b) => a - b);

      if (rules.no3Consecutive && has3Consecutive(result)) continue;
      if (rules.no3SameLastDigit && has3SameLastDigit(result)) continue;

      return result;
    }
    throw new Error("조건이 조금 빡세서 추천 생성에 실패했어요. 옵션을 완화해 주세요.");
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  }

  // ---------- 상태 ----------
  let history = [];
  let current = null;
  let lastMany = [];

  // ---------- DOM ----------
  const elFixed = document.getElementById("fixed");
  const elExcluded = document.getElementById("excluded");
  const elFixedView = document.getElementById("fixedView");
  const elExcludedView = document.getElementById("excludedView");
  const elOptConsec = document.getElementById("optConsec");
  const elOptLastDigit = document.getElementById("optLastDigit");
  const elCount = document.getElementById("count");

  const elCurrent = document.getElementById("current");
  const elHistory = document.getElementById("history");

  const elErrorBox = document.getElementById("errorBox");

  const btnOne = document.getElementById("btnOne");
  const btnMany = document.getElementById("btnMany");
  const btnCopyOne = document.getElementById("btnCopyOne");
  const btnCopyMany = document.getElementById("btnCopyMany");
  const btnCopyAll = document.getElementById("btnCopyAll");
  const btnClear = document.getElementById("btnClear");

  const manyBox = document.getElementById("manyBox");
  const manyText = document.getElementById("manyText");

  // ---------- 렌더 ----------
  function setError(msg) {
    if (!msg) {
      elErrorBox.style.display = "none";
      elErrorBox.textContent = "";
    } else {
      elErrorBox.style.display = "block";
      elErrorBox.textContent = "⚠️ " + msg;
    }
  }

  function renderParsedViews() {
    const fixed = parseNumberList(elFixed.value).sort((a,b)=>a-b);
    const excluded = parseNumberList(elExcluded.value).sort((a,b)=>a-b);

    elFixedView.textContent = fixed.length ? fixed.join(", ") : "없음";
    elExcludedView.textContent = excluded.length ? excluded.join(", ") : "없음";
  }

  function renderHistory() {
    elHistory.innerHTML = "";

    if (history.length === 0) {
      const div = document.createElement("div");
      div.className = "item";
      div.style.opacity = "0.7";
      div.textContent = "아직 기록이 없어요.";
      elHistory.appendChild(div);
    } else {
      history.forEach((set, idx) => {
        const row = document.createElement("div");
        row.className = "item";

        const left = document.createElement("div");
        left.innerHTML = "<code>" + String(idx + 1).padStart(2,"0") + ". " + formatSet(set) + "</code>";

        const rightBtn = document.createElement("button");
        rightBtn.textContent = "복사";
        rightBtn.onclick = () => copyText(formatSet(set));

        row.appendChild(left);
        row.appendChild(rightBtn);
        elHistory.appendChild(row);
      });
    }

    const hasAny = history.length > 0;
    btnCopyAll.disabled = !hasAny;
    btnClear.disabled = !hasAny;
  }

  function renderButtons() {
    btnCopyOne.disabled = !current;
    btnCopyMany.disabled = !(lastMany && lastMany.length);
  }

  function renderCurrent() {
    elCurrent.textContent = current ? formatSet(current) : "아직 없음";
  }

  function renderMany() {
    if (!lastMany || lastMany.length === 0) {
      manyBox.style.display = "none";
      manyText.textContent = "";
      return;
    }
    manyBox.style.display = "block";
    manyText.textContent = lastMany.map((s, i) => (i+1) + ". " + formatSet(s)).join("\\n");
  }

  function pushHistory(sets) {
    history = sets.concat(history).slice(0, 50);
  }

  // ---------- 이벤트 ----------
  elFixed.addEventListener("input", renderParsedViews);
  elExcluded.addEventListener("input", renderParsedViews);

  btnOne.addEventListener("click", () => {
    try {
      setError("");
      const fixed = parseNumberList(elFixed.value);
      const excluded = parseNumberList(elExcluded.value);
      const rules = { no3Consecutive: elOptConsec.checked, no3SameLastDigit: elOptLastDigit.checked };

      const one = generateOneSet(fixed, excluded, rules);
      current = one;
      lastMany = [];
      pushHistory([one]);

      renderCurrent();
      renderMany();
      renderHistory();
      renderButtons();
    } catch (e) {
      setError(e.message || "알 수 없는 오류");
    }
  });

  btnMany.addEventListener("click", () => {
    try {
      setError("");
      const fixed = parseNumberList(elFixed.value);
      const excluded = parseNumberList(elExcluded.value);
      const rules = { no3Consecutive: elOptConsec.checked, no3SameLastDigit: elOptLastDigit.checked };

      let n = Number(elCount.value);
      if (!Number.isFinite(n)) n = 5;
      n = Math.max(1, Math.min(20, n));

      const sets = [];
      for (let i = 0; i < n; i++) sets.push(generateOneSet(fixed, excluded, rules));

      lastMany = sets;
      current = sets[0] || null;
      pushHistory(sets);

      renderCurrent();
      renderMany();
      renderHistory();
      renderButtons();
    } catch (e) {
      setError(e.message || "알 수 없는 오류");
    }
  });

  btnCopyOne.addEventListener("click", () => {
    if (current) copyText(formatSet(current));
  });

  btnCopyMany.addEventListener("click", () => {
    if (lastMany && lastMany.length) {
      const text = lastMany.map((s,i)=> (i+1)+". "+formatSet(s)).join("\\n");
      copyText(text);
    }
  });

  btnCopyAll.addEventListener("click", () => {
    if (history.length) {
      const text = history.map((s,i)=> (i+1)+". "+formatSet(s)).join("\\n");
      copyText(text);
    }
  });

  btnClear.addEventListener("click", () => {
    history = [];
    current = null;
    lastMany = [];
    setError("");

    renderCurrent();
    renderMany();
    renderHistory();
    renderButtons();
  });

  // 최초 렌더
  renderParsedViews();
  renderCurrent();
  renderMany();
  renderHistory();
  renderButtons();
</script>
</body>
</html>
